name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      slow:
        description: "Also run the slow tests (all 25 walkthrough replays)"
        type: boolean
        default: false

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/inspect_textquests
          key: textquests-data-${{ hashFiles('src/textquests/data.py') }}
      - run: uv sync --frozen
      - run: uv run pytest
        env:
          RUN_SLOW_TESTS: ${{ inputs.slow && '1' || '0' }}
